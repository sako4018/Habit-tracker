name: streakly

description: A simple, good-looking habit tracker with streaks.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  audioplayers: ^6.8.1
  device_preview: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/habit_complete.mp3
    - assets/icon/streakly_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/streakly_icon.png"
