<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #121212;
      color: #ffffff;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #F5A623; }
    a:hover { color: #d98f14; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9a9a9a;
    }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #121212; display: flex; flex-direction: column; position: relative;">

  <!-- header -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 18px 0;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Днес</span>
      <span style="font-size: 13px; color: #9a9a9a;">вторник, 8 септември</span>
    </div>
    <div style="width: 38px; height: 38px; border-radius: 999px; background: #1e1e1e; border: 1px solid #2a2a2a; display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </div>
  </div>

  <!-- one small line of progress, nothing more -->
  <div style="padding: 18px 18px 0; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 13px; color: #b0b0b0;">
        <span class="mono" style="color: {{accent}}; font-weight: 600; font-size: 15px;">4</span>
        от <span class="mono" style="color: #d0d0d0;">6</span> изпълнени
      </span>
      <span style="font-size: 12px; color: #9a9a9a;">остават 2</span>
    </div>
    <div style="height: 4px; border-radius: 999px; background: #2a2a2a; overflow: hidden;">
      <div style="height: 100%; width: 67%; background: {{accent}}; border-radius: 999px;"></div>
    </div>
  </div>

  <!-- HABITS — the primary action, nothing above it but the day itself -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 28px 18px 0;">
    <span class="eyebrow">Навици</span>

    <sc-for list="{{habits}}" as="h" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 13px; background: #1a1a1a; border: 1px solid {{h.border}}; border-radius: 16px; padding: 15px 14px 15px 15px;">
        <div style="width: 44px; height: 44px; border-radius: 13px; background: {{h.chipBg}}; display: flex; align-items: center; justify-content: center; font-size: 21px; flex-shrink: 0;">{{h.emoji}}</div>

        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{h.name}}</span>
          <span style="font-size: 12px; color: #9a9a9a; display: flex; align-items: center; gap: 5px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="{{h.flame}}"><path d="M12 2c1 4-2 5-2 8a2 2 0 004 0c0-1 1-2 1-2 2 2 3 4 3 6a6 6 0 01-12 0c0-4 4-6 6-10z"/></svg>
            {{h.streakText}}
          </span>
        </div>

        <sc-if value="{{h.done}}" hint-placeholder-val="{{ true }}">
          <div style="width: 46px; height: 46px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <div style="width: 34px; height: 34px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{h.pending}}" hint-placeholder-val="{{ false }}">
          <div style="width: 46px; height: 46px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <div style="width: 34px; height: 34px; border-radius: 999px; border: 2px solid #5c5c5c;"></div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <!-- TASKS — the app already has these -->
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 24px 18px 0;">
    <span class="eyebrow">Задачи за днес</span>

    <sc-for list="{{tasks}}" as="t" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 13px; background: #1a1a1a; border: 1px solid #262626; border-radius: 16px; padding: 11px 14px;">
        <div style="width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin: -6px 0;">
          <div style="width: 28px; height: 28px; border-radius: 999px; background: {{t.fill}}; border: 2px solid {{t.ring}}; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{t.done}}" hint-placeholder-val="{{ true }}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </sc-if>
          </div>
        </div>
        <span style="font-size: 15px; color: {{t.fg}}; text-decoration: {{t.strike}}; text-decoration-color: #8a8a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.name}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 96px;"></div>

  <!-- add button -->
  <div style="position: absolute; right: 18px; bottom: 104px; height: 54px; border-radius: 999px; background: {{accent}}; display: flex; align-items: center; gap: 8px; padding: 0 22px 0 18px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span style="font-size: 15px; font-weight: 600; color: #121212;">Добави</span>
  </div>

  <!-- bottom nav -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1a1a1a; border-top: 1px solid #262626; padding: 12px 0 26px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.06em;">ДНЕС</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9a9a9a;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.06em;">СТАТ</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9a9a9a;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 00-1.7-1l-.4-2.5H10l-.4 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 000 2l-2 1.6 2 3.4 2.4-1a7 7 0 001.7 1l.4 2.5h4l.4-2.5a7 7 0 001.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z"/></svg>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.06em;">НАСТР</span>
    </div>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#F5A623","options":["#F5A623","#FF8A3D","#64B5F6","#81C784","#E57373","#F06292"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F5A623';
    const hex = accent.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    const tint = (a) => `rgba(${r}, ${g}, ${b}, ${a})`;

    const raw = [
      { emoji: '🏃', name: 'Спорт',     streak: 12, done: true },
      { emoji: '📖', name: 'Четене',    streak: 4,  done: true },
      { emoji: '💧', name: 'Вода',      streak: 21, done: true },
      { emoji: '🧘', name: 'Медитация', streak: 0,  done: false },
    ];

    const habits = raw.map((h) => ({
      ...h,
      pending: !h.done,
      chipBg: tint(0.15),
      border: h.done ? tint(0.24) : '#2e2e2e',
      flame: h.streak > 0 ? accent : '#7a7a7a',
      streakText: h.streak > 0
        ? `${h.streak} ${h.streak === 1 ? 'ден' : 'дни'} подред`
        : 'започни отново',
    }));

    const rawTasks = [
      { name: 'Купи подарък за Мира', done: true },
      { name: 'Запиши час при зъболекар', done: false },
    ];

    const tasks = rawTasks.map((t) => ({
      ...t,
      fill: t.done ? accent : 'transparent',
      ring: t.done ? accent : '#5c5c5c',
      fg: t.done ? '#9a9a9a' : '#ffffff',
      strike: t.done ? 'line-through' : 'none',
    }));

    return { accent, habits, tasks };
  }
}
</script>
</body>
</html>
