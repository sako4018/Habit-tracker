<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #121212;
      color: #ffffff;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #BB86FC; }
    a:hover { color: #a06ee6; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6e6e6e;
    }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #121212; padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 24px;">

  <div style="display: flex; flex-direction: column; gap: 3px; padding-top: 8px;">
    <span class="eyebrow">Последни 12 месеца</span>
    <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Статистика</span>
  </div>

  <!-- two rings -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="position: relative; width: 88px; height: 88px;">
        <svg width="88" height="88" viewBox="0 0 88 88">
          <circle cx="44" cy="44" r="38" fill="none" stroke="#2a2a2a" stroke-width="7"/>
          <circle cx="44" cy="44" r="38" fill="none" stroke="{{accent}}" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="239" stroke-dashoffset="31" transform="rotate(-90 44 44)"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 600;">87%</span>
        </div>
      </div>
      <span style="font-size: 12px; color: #9e9e9e; text-align: center;">Успеваемост<br>30 дни</span>
    </div>
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 18px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <div style="position: relative; width: 88px; height: 88px;">
        <svg width="88" height="88" viewBox="0 0 88 88">
          <circle cx="44" cy="44" r="38" fill="none" stroke="#2a2a2a" stroke-width="7"/>
          <circle cx="44" cy="44" r="38" fill="none" stroke="#5a5a5a" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="239" stroke-dashoffset="96" transform="rotate(-90 44 44)"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 600;">60%</span>
        </div>
      </div>
      <span style="font-size: 12px; color: #9e9e9e; text-align: center;">Дни без<br>пропуск</span>
    </div>
  </div>

  <!-- year heatmap hero -->
  <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span class="eyebrow">Активност 2026</span>
      <span class="mono" style="font-size: 12px; color: #c9c9c9;">231 дни</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; overflow: hidden;">
      <div class="mono" style="display: flex; gap: 24px; font-size: 9px; color: #5a5a5a; padding-left: 2px;">
        <span>яну</span><span>мар</span><span>май</span><span>юли</span><span>сеп</span><span>ное</span>
      </div>
      <div style="display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px;">
        <sc-for list="{{yearCells}}" as="c" hint-placeholder-count="119">
          <div style="width: 100%; aspect-ratio: 1; border-radius: 2px; background: {{c.bg}};"></div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px; align-self: flex-end;">
        <span class="mono" style="font-size: 9px; color: #5a5a5a;">по-малко</span>
        <sc-for list="{{legend}}" as="l" hint-placeholder-count="5">
          <div style="width: 10px; height: 10px; border-radius: 2px; background: {{l.bg}};"></div>
        </sc-for>
        <span class="mono" style="font-size: 9px; color: #5a5a5a;">повече</span>
      </div>
    </div>
  </div>

  <!-- 2x2 stat grid -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
      <span class="mono" style="font-size: 26px; font-weight: 600; color: {{accent}};">21</span>
      <span style="font-size: 12px; color: #6e6e6e;">Най-дълъг streak</span>
    </div>
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
      <span class="mono" style="font-size: 26px; font-weight: 600;">340</span>
      <span style="font-size: 12px; color: #6e6e6e;">Общо отчитания</span>
    </div>
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
      <span class="mono" style="font-size: 26px; font-weight: 600;">5</span>
      <span style="font-size: 12px; color: #6e6e6e;">Активни навика</span>
    </div>
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px;">
      <span class="mono" style="font-size: 26px; font-weight: 600;">3</span>
      <span style="font-size: 12px; color: #6e6e6e;">Дни от последен пропуск</span>
    </div>
  </div>

  <!-- per-habit breakdown -->
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <span class="eyebrow">По навик · 30 дни</span>
    <sc-for list="{{breakdown}}" as="b" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 16px; width: 22px; text-align: center;">{{b.emoji}}</span>
        <span style="font-size: 13px; width: 84px; color: #c9c9c9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.name}}</span>
        <div style="flex-grow: 1; height: 8px; border-radius: 999px; background: #242424; overflow: hidden;">
          <div style="height: 100%; width: {{b.pct}}; background: {{accent}}; border-radius: 999px;"></div>
        </div>
        <span class="mono" style="font-size: 12px; color: #9e9e9e; width: 34px; text-align: right;">{{b.pct}}</span>
      </div>
    </sc-for>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#BB86FC","options":["#BB86FC","#64B5F6","#81C784","#FFB74D","#E57373","#F06292"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#BB86FC';
    const hex = accent.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    const tint = (a) => `rgba(${r}, ${g}, ${b}, ${a})`;

    const ramp = ['#242424', tint(0.22), tint(0.42), tint(0.66), accent];
    const legend = ramp.map((bg) => ({ bg }));

    // 17 weeks x 7 days
    const yearCells = [];
    let seed = 7;
    for (let i = 0; i < 119; i++) {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      const rnd = (seed % 100) / 100;
      let level = 0;
      if (rnd > 0.28) level = 1;
      if (rnd > 0.5) level = 2;
      if (rnd > 0.72) level = 3;
      if (rnd > 0.88) level = 4;
      yearCells.push({ bg: ramp[level] });
    }

    const breakdown = [
      { emoji: '💧', name: 'Вода', pct: '100%' },
      { emoji: '🏃', name: 'Спорт', pct: '83%' },
      { emoji: '📖', name: 'Четене', pct: '67%' },
      { emoji: '🧘', name: 'Медитация', pct: '41%' },
    ];

    return { accent, legend, yearCells, breakdown };
  }
}
</script>
</body>
</html>
