<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #121212;
      color: #ffffff;
      font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #FF8A3D; }
    a:hover { color: #e0722a; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6e6e6e;
    }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #121212; display: flex; flex-direction: column;">

  <div style="padding: 28px 18px 0;">
    <span style="font-size: 27px; font-weight: 700; letter-spacing: -0.02em;">Статистика</span>
  </div>

  <!-- HERO: the one heatmap in the app -->
  <div style="padding: 24px 18px 0;">
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span class="eyebrow">Активност 2026</span>
        <span style="font-size: 12px; color: #9e9e9e;"><span class="mono" style="color: #e0e0e0;">231</span> активни дни</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div class="mono" style="display: flex; justify-content: space-between; font-size: 9px; color: #5a5a5a; padding: 0 1px;">
          <span>яну</span><span>мар</span><span>май</span><span>юли</span><span>сеп</span><span>ное</span>
        </div>
        <div style="display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px;">
          <sc-for list="{{yearCells}}" as="c" hint-placeholder-count="119">
            <div style="width: 100%; aspect-ratio: 1; border-radius: 2px; background: {{c.bg}};"></div>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; align-self: flex-end; margin-top: 3px;">
          <span class="mono" style="font-size: 9px; color: #5a5a5a;">0</span>
          <sc-for list="{{legend}}" as="l" hint-placeholder-count="5">
            <div style="width: 11px; height: 11px; border-radius: 2px; background: {{l.bg}};"></div>
          </sc-for>
          <span class="mono" style="font-size: 9px; color: #5a5a5a;">4 навика</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 30-day rate: one ring, one idea -->
  <div style="padding: 14px 18px 0;">
    <div style="background: #1a1a1a; border: 1px solid #262626; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 20px;">
      <div style="position: relative; width: 84px; height: 84px; flex-shrink: 0;">
        <svg width="84" height="84" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="#2a2a2a" stroke-width="7"/>
          <circle cx="42" cy="42" r="36" fill="none" stroke="{{accent}}" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="226" stroke-dashoffset="29" transform="rotate(-90 42 42)"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span class="mono" style="font-size: 20px; font-weight: 600;">87%</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 15px; font-weight: 600;">Успеваемост</span>
        <span style="font-size: 13px; color: #6e6e6e; line-height: 1.45;">Отметнати навици<br>за последните 30 дни</span>
      </div>
    </div>
  </div>

  <!-- three numbers the app already computes -->
  <div style="padding: 14px 18px 0;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #262626; border: 1px solid #262626; border-radius: 16px; overflow: hidden;">
      <div style="background: #1a1a1a; padding: 16px 10px; display: flex; flex-direction: column; gap: 5px; align-items: center;">
        <span class="mono" style="font-size: 23px; font-weight: 600; color: {{accent}};">28</span>
        <span style="font-size: 10px; color: #6e6e6e; letter-spacing: 0.04em; text-align: center;">НАЙ-ДЪЛЪГ</span>
      </div>
      <div style="background: #1a1a1a; padding: 16px 10px; display: flex; flex-direction: column; gap: 5px; align-items: center;">
        <span class="mono" style="font-size: 23px; font-weight: 600;">340</span>
        <span style="font-size: 10px; color: #6e6e6e; letter-spacing: 0.04em; text-align: center;">ОБЩО</span>
      </div>
      <div style="background: #1a1a1a; padding: 16px 10px; display: flex; flex-direction: column; gap: 5px; align-items: center;">
        <span class="mono" style="font-size: 23px; font-weight: 600;">4</span>
        <span style="font-size: 10px; color: #6e6e6e; letter-spacing: 0.04em; text-align: center;">НАВИКА</span>
      </div>
    </div>
  </div>

  <!-- per-habit breakdown -->
  <div style="display: flex; flex-direction: column; gap: 13px; padding: 26px 18px 0;">
    <span class="eyebrow">По навик · 30 дни</span>
    <sc-for list="{{breakdown}}" as="b" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 16px; width: 22px; text-align: center;">{{b.emoji}}</span>
        <span style="font-size: 13px; width: 88px; color: #c9c9c9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{b.name}}</span>
        <div style="flex-grow: 1; height: 8px; border-radius: 999px; background: #242424; overflow: hidden;">
          <div style="height: 100%; width: {{b.pct}}; background: {{b.bar}}; border-radius: 999px;"></div>
        </div>
        <span class="mono" style="font-size: 12px; color: #9e9e9e; width: 36px; text-align: right;">{{b.pct}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 28px;"></div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1a1a1a; border-top: 1px solid #262626; padding: 12px 0 26px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5a5a5a;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.06em;">ДНЕС</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: {{accent}};">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-7M22 19H2"/></svg>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.06em;">СТАТ</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5a5a5a;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 00-1.7-1l-.4-2.5H10l-.4 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 000 2l-2 1.6 2 3.4 2.4-1a7 7 0 001.7 1l.4 2.5h4l.4-2.5a7 7 0 001.7-1l2.4 1 2-3.4-2-1.6c.1-.3.1-.7.1-1z"/></svg>
      <span class="mono" style="font-size: 10px; letter-spacing: 0.06em;">НАСТР</span>
    </div>
  </div>

</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#FF8A3D","options":["#FF8A3D","#BB86FC","#64B5F6","#81C784","#E57373","#F06292"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF8A3D';
    const hex = accent.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    const tint = (a) => `rgba(${r}, ${g}, ${b}, ${a})`;

    // Тук интензитетът е честен: колко от 4-те навика са отметнати за деня.
    const ramp = ['#242424', tint(0.24), tint(0.45), tint(0.7), accent];
    const legend = ramp.map((bg) => ({ bg }));

    const yearCells = [];
    let seed = 7;
    for (let i = 0; i < 119; i++) {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      const rnd = (seed % 100) / 100;
      let level = 0;
      if (rnd > 0.22) level = 1;
      if (rnd > 0.42) level = 2;
      if (rnd > 0.64) level = 3;
      if (rnd > 0.84) level = 4;
      yearCells.push({ bg: ramp[level] });
    }

    const breakdown = [
      { emoji: '💧', name: 'Вода', pct: '100%' },
      { emoji: '🏃', name: 'Спорт', pct: '83%' },
      { emoji: '📖', name: 'Четене', pct: '67%' },
      { emoji: '🧘', name: 'Медитация', pct: '41%' },
    ].map((b) => ({ ...b, bar: accent }));

    return { accent, legend, yearCells, breakdown };
  }
}
</script>
</body>
</html>
